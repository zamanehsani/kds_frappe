<script>
(function () {
    if (globalThis.__kds_web_app_loader_installed__) return;
    globalThis.__kds_web_app_loader_installed__ = true;

    const DEV_SERVER_ORIGIN = 'http://localhost:5173';
    const DEV_PROBE_TIMEOUT_MS = 1200;
    const MANIFEST_PATH = '/assets/pizza_kds/kds/.vite/manifest.json';
    const LOADED_STYLE_IDS = new Set(globalThis.__kds_loaded_style_ids__ || []);
    globalThis.__kds_loaded_style_ids__ = LOADED_STYLE_IDS;
    const IS_LOCAL_PAGE = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname);

    function appendModuleScript(src) {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = src;
        document.head.appendChild(script);
        return script;
    }

    function canReachDevServer() {
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timeoutId = setTimeout(() => {
            controller?.abort();
        }, DEV_PROBE_TIMEOUT_MS);

        return fetch(`${DEV_SERVER_ORIGIN}/@vite/client`, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            signal: controller?.signal,
        })
            .then((response) => response.ok)
            .catch(() => false)
            .finally(() => clearTimeout(timeoutId));
    }

    function appendStylesheet(href) {
        if (LOADED_STYLE_IDS.has(href)) return;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
        LOADED_STYLE_IDS.add(href);
    }

    function loadFromDevServer() {
        const preamble = document.createElement('script');
        preamble.type = 'module';
        preamble.innerHTML = `
            import RefreshRuntime from '${DEV_SERVER_ORIGIN}/@react-refresh'
            RefreshRuntime.injectIntoGlobalHook(window)
            window.$RefreshReg$ = () => {}
            window.$RefreshSig$ = () => (type) => type
            window.__vite_plugin_react_preamble_installed__ = true
        `;
        document.head.appendChild(preamble);

        const viteClient = appendModuleScript(`${DEV_SERVER_ORIGIN}/@vite/client`);
        viteClient.onerror = () => {
            loadFromBuiltAssets().catch(() => {});
        };
        viteClient.onload = () => appendModuleScript(`${DEV_SERVER_ORIGIN}/src/main.jsx`);
    }

    async function loadFromBuiltAssets() {
        const response = await fetch(MANIFEST_PATH, { cache: 'no-store' });
        if (!response.ok) {
            throw new Error(`Manifest request failed with status ${response.status}`);
        }

        const manifest = await response.json();
        const entry = manifest['index.html'];
        if (!entry?.file) {
            throw new Error('Built entry for index.html was not found in the manifest');
        }

        (entry.css || []).forEach((href) => appendStylesheet(`/assets/pizza_kds/kds/${href}`));
        appendModuleScript(`/assets/pizza_kds/kds/${entry.file}`);
    }

    if (!IS_LOCAL_PAGE) {
        loadFromBuiltAssets().catch(() => {});
        return;
    }

    canReachDevServer()
        .then((isAvailable) => {
            if (isAvailable) {
                loadFromDevServer();
                return;
            }

            return loadFromBuiltAssets();
        })
        .catch(() => {
            loadFromBuiltAssets().catch(() => {});
        });
})();
</script>
